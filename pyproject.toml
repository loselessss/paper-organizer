[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-organizer"
version = "1.3.0"
description = "Local-first academic PDF organizer with portable paperpack archives"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyMuPDF>=1.24",
]

[project.optional-dependencies]
gui = ["PyQt5>=5.15", "keyring>=25"]
cloud = ["keyring>=25"]
build = [
  "pyinstaller>=6.15",
  "numpy>=2",
  "opencv-python-headless>=4.11",
  "onnxruntime>=1.22",
  "rapidocr>=3",
  "pillow>=10",
]

[project.scripts]
paper-organizer = "paper_organizer.cli:main"
paper-organizer-gui = "paper_organizer.gui:main"

[tool.setuptools.packages.find]
include = ["paper_organizer*"]

[tool.setuptools.package-data]
paper_organizer = ["assets/*.png", "assets/*.ico", "models/*.json"]
