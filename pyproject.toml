[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-organizer"
version = "0.1.0"
description = "Local-first academic PDF organizer and searchable JSON library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyMuPDF>=1.24",
]

[project.optional-dependencies]
gui = ["PyQt5>=5.15"]
cloud = ["keyring>=25"]

[project.scripts]
paper-organizer = "paper_organizer.cli:main"

[tool.setuptools.packages.find]
include = ["paper_organizer*"]
