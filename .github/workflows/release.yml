name: Windows release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Create build environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e .[gui,build]

      - name: Run tests
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        run: cmd /c build_installer.bat

      - name: Sign Windows installer with timestamp
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)) {
            throw "Windows signing certificate secrets are required for a public release."
          }
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $installer = "Output\PaperOrganizer_Setup_$version.exe"
          $certificate = Join-Path $env:RUNNER_TEMP "paper-organizer-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64)
          )
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) { throw "signtool.exe was not found." }
          & $signtool.FullName sign /f $certificate `
            /p $env:SIGNING_CERTIFICATE_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 $installer
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed." }
          & $signtool.FullName verify /pa /all /v $installer
          if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed." }
          Remove-Item -LiteralPath $certificate -Force

      - name: Create SHA-256 file
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $installer = "Output\PaperOrganizer_Setup_$version.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Installer was not created: $installer"
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          "$hash  PaperOrganizer_Setup_$version.exe" |
            Set-Content -Encoding ascii -LiteralPath "$installer.sha256"
          $latestInstaller = "Output\PaperOrganizer_Setup_latest.exe"
          Copy-Item -LiteralPath $installer -Destination $latestInstaller
          "$hash  PaperOrganizer_Setup_latest.exe" |
            Set-Content -Encoding ascii -LiteralPath "$latestInstaller.sha256"

      - name: Create detailed release notes
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          python scripts/extract_release_notes.py $version |
            Set-Content -Encoding utf8 -LiteralPath release-notes.md

      - name: Preserve installer as workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: PaperOrganizer-${{ github.ref_name }}-windows
          path: |
            Output/PaperOrganizer_Setup_*.exe
            Output/PaperOrganizer_Setup_*.exe.sha256
          compression-level: 0

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          $installer = "Output\PaperOrganizer_Setup_$version.exe"
          $checksum = "$installer.sha256"
          $latestInstaller = "Output\PaperOrganizer_Setup_latest.exe"
          $latestChecksum = "$latestInstaller.sha256"
          gh release create $tag $installer $checksum $latestInstaller $latestChecksum `
            --verify-tag `
            --title "Paper Organizer $version" `
            --notes-file release-notes.md
