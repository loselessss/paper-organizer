name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .[gui]
      - name: Compile
        run: python -m compileall -q paper_organizer scripts tests run.py
      - name: Secret scan
        run: python scripts/check_secrets.py
      - name: Test
        run: python -m unittest discover -s tests -v
